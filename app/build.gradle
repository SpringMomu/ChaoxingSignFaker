plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    id("com.google.protobuf") version "0.9.6"
    id("org.jetbrains.kotlin.plugin.serialization") version "2.4.20"
}

def localSigningProperties = new Properties()
def localSigningFile = rootProject.file("signing/local-release.properties")
if (localSigningFile.exists()) {
    localSigningFile.withInputStream { localSigningProperties.load(it) }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def imEncryptedKey = (project.findProperty("imEncryptedKey")
        ?: System.getenv("imEncryptedKey")
        ?: localProperties.getProperty("imEncryptedKey")
        ?: "").toString().trim()

android {
    namespace = "org.aquamarine5.brainspark.chaoxingsignfaker"
    compileSdk = 37

    defaultConfig {
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
        applicationId = "org.aquamarine5.brainspark.chaoxingsignfaker"
        minSdk = 26
        targetSdk = 37
        versionCode = 1_1901_9009
        versionName = "1.19.1-rc9-260929"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (localSigningFile.exists()) {
            register("localRelease") {
                storeFile rootProject.file("signing/local-release.jks")
                storePassword localSigningProperties.getProperty("storePassword")
                keyAlias "local-release"
                keyPassword localSigningProperties.getProperty("storePassword")
            }
        }
        register("chaoxingsignfaker") {
            storeFile rootProject.file("chaoxingsignfaker.jks")
            storePassword System.getenv("keystorePassword")
            keyAlias "chaoxingsignfaker"
            keyPassword System.getenv("keystorePassword")
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            optimization {
                enable = true // Enables code and resource optimizations.
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
            if (System.getenv("keystorePassword")) {
                signingConfig signingConfigs.chaoxingsignfaker
            } else if (localSigningFile.exists()) {
                signingConfig signingConfigs.localRelease
            }
            buildConfigField("String", "releaseDate", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\"")
            buildConfigField("String", "imEncryptedKey", "\"${imEncryptedKey}\"")
        }
        debug {
            if (System.getenv("keystorePassword")) signingConfig signingConfigs.chaoxingsignfaker
            buildConfigField("String", "releaseDate", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\"")
            buildConfigField("String", "imEncryptedKey", "\"${imEncryptedKey}\"")
        }
    }

    gradle.taskGraph.whenReady { graph ->
        if (imEncryptedKey.isEmpty() && graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
            throw new GradleException("imEncryptedKey is not set. Add imEncryptedKey=<key> to local.properties, or pass -PimEncryptedKey / env imEncryptedKey; otherwise group chat sign-in fails with 'Empty key'.")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    buildFeatures {
        compose = true
    }
}

composeCompiler {
    reportsDestination = layout.buildDirectory.dir("compose_compiler")
    metricsDestination = layout.buildDirectory.dir("compose_compiler")
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.36.2"
    }

    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

